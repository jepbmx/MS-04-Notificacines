spring.application.name=notificaciones

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ms_notifications?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Set these credentials through environment variables. USER usernames identify notification owners.
app.security.users[0].username=${NOTIFICATIONS_USER:}
app.security.users[0].password=${NOTIFICATIONS_PASSWORD:}
app.security.users[0].roles[0]=USER
app.security.users[1].username=${NOTIFICATIONS_ADMIN_USER:}
app.security.users[1].password=${NOTIFICATIONS_ADMIN_PASSWORD:}
app.security.users[1].roles[0]=ADMIN
app.security.users[2].username=${NOTIFICATIONS_SERVICE_USER:}
app.security.users[2].password=${NOTIFICATIONS_SERVICE_PASSWORD:}
app.security.users[2].roles[0]=SERVICE

# Comma-separated receiver IDs for deliberately failing local/demo deliveries.
app.notifications.simulator.fail-for-receivers=${NOTIFICATION_FAILURE_RECEIVERS:}
